  :root{
    --ground:#EEE2C9; --surface:#FFFAF0; --surface-2:#F7ECD6;
    --ink:#241A10; --ink-soft:#6B5A42; --ink-faint:#9C8B70; --line:#D9C6A3;
    --gold:#B9822C; --gold-strong:#8F6420; --gold-tint:#E4C48C;
    --teal:#1F4B45; --teal-strong:#163632; --teal-tint:#B7D6D0;
    --danger:#A23B2E;
    --shadow:rgba(36,23,10,.16); --shadow-soft:rgba(36,23,10,.08);
    --radius:3px 18px 3px 18px; --radius-sm:2px 10px 2px 10px;
    --ease:cubic-bezier(.4,0,.2,1);
    --maxw:1080px;
  }
  @media (prefers-color-scheme:dark){:root{
    --ground:#15120D; --surface:#1E1911; --surface-2:#241E15;
    --ink:#F3E7CE; --ink-soft:#C9B999; --ink-faint:#8C7E64; --line:#3A3122;
    --gold:#E3A94A; --gold-strong:#F0BE6E; --gold-tint:#6B5228;
    --teal:#6BAAA0; --teal-strong:#8FC2B9; --teal-tint:#24413C;
    --danger:#E07A68;
    --shadow:rgba(0,0,0,.5); --shadow-soft:rgba(0,0,0,.3);
  }}
  html[data-theme="dark"]{
    --ground:#15120D; --surface:#1E1911; --surface-2:#241E15;
    --ink:#F3E7CE; --ink-soft:#C9B999; --ink-faint:#8C7E64; --line:#3A3122;
    --gold:#E3A94A; --gold-strong:#F0BE6E; --gold-tint:#6B5228;
    --teal:#6BAAA0; --teal-strong:#8FC2B9; --teal-tint:#24413C;
    --danger:#E07A68;
    --shadow:rgba(0,0,0,.5); --shadow-soft:rgba(0,0,0,.3);
  }
  html[data-theme="light"]{
    --ground:#EEE2C9; --surface:#FFFAF0; --surface-2:#F7ECD6;
    --ink:#241A10; --ink-soft:#6B5A42; --ink-faint:#9C8B70; --line:#D9C6A3;
    --gold:#B9822C; --gold-strong:#8F6420; --gold-tint:#E4C48C;
    --teal:#1F4B45; --teal-strong:#163632; --teal-tint:#B7D6D0;
    --danger:#A23B2E;
    --shadow:rgba(36,23,10,.16); --shadow-soft:rgba(36,23,10,.08);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ground); color:var(--ink);
    font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif;
    font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;
    transition:background-color .25s var(--ease),color .25s var(--ease);
    padding-bottom:96px;
  }
  html[lang="ar"] body{ font-family:'Noto Kufi Arabic',ui-sans-serif,system-ui,sans-serif; }
  @media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}}

  button{font-family:inherit;}
  .display{font-family:'Bricolage Grotesque',ui-sans-serif,system-ui,sans-serif; font-weight:700; letter-spacing:-.01em; text-wrap:balance;}
  html[lang="ar"] .display{ font-family:'Noto Kufi Arabic',ui-sans-serif,system-ui,sans-serif; }
  .num{font-family:'IBM Plex Mono',ui-monospace,monospace; font-variant-numeric:tabular-nums;}

  .wrap{max-width:var(--maxw); margin:0 auto; padding:0 20px;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:40;
    background:color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 0;}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:38px; height:38px; border-radius:var(--radius-sm);
    background:linear-gradient(135deg,var(--gold),var(--gold-strong));

  // ---------- State ----------
  var state = {
    lang: "fr",
    query: "",
    activeFilters: new Set(),
    activeCategory: "starters",
    cart: {},      // id -> qty
    tableNumber: ""
  };

  function loadPersisted() {
    try {
      var lang = localStorage.getItem("safran_lang");
      if (lang && STRINGS[lang]) state.lang = lang;
      var theme = localStorage.getItem("safran_theme");
      applyTheme(theme || (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
      var savedCart = JSON.parse(localStorage.getItem("safran_cart") || "{}");
      if (savedCart && typeof savedCart === "object") state.cart = savedCart;
      var savedTable = localStorage.getItem("safran_table");
      if (savedTable) state.tableNumber = savedTable;
    } catch (e) {}
  }
  function persistCart() {
    try { localStorage.setItem("safran_cart", JSON.stringify(state.cart)); } catch (e) {}
  }

  function t(key) { return STRINGS[state.lang][key] || key; }

  // ---------- Theme ----------
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    var icon = document.getElementById("themeIcon");
    if (theme === "dark") {
      icon.innerHTML = '<path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>';
    } else {
      icon.innerHTML = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
    }
  }

  // ---------- Illustration ----------

      '<radialGradient id="rimG" cx="50%" cy="45%" r="65%"><stop offset="0%" stop-color="var(--surface)"/><stop offset="100%" stop-color="var(--surface-2)"/></radialGradient>' +
      '<radialGradient id="sauceG" cx="46%" cy="42%" r="60%"><stop offset="0%" stop-color="#E8B860"/><stop offset="70%" stop-color="#C98A2C"/><stop offset="100%" stop-color="#8F6420"/></radialGradient>' +
      '</defs>' +
      '<circle cx="100" cy="100" r="98" fill="url(#rimG)"/>' +
      '<circle cx="100" cy="100" r="98" fill="none" stroke="var(--line)" stroke-width="1.5"/>' +
      '<circle cx="100" cy="100" r="78" fill="url(#sauceG)"/>' +

      '<ellipse cx="120" cy="70" rx="9" ry="6.5" fill="#4A2E1E" transform="rotate(12 120 70)"/>' +
      '<ellipse cx="128" cy="118" rx="10" ry="7" fill="#4A2E1E" transform="rotate(30 128 118)"/>' +
      '<ellipse cx="80" cy="128" rx="9" ry="6" fill="#4A2E1E" transform="rotate(-10 80 128)"/>' +
      '</g>' +
      '<g opacity="0.95">' +
      '<ellipse cx="95" cy="65" rx="5" ry="2" fill="#E9D9AE" transform="rotate(20 95 65)"/>' +
      '<ellipse cx="112" cy="95" rx="5" ry="2" fill="#E9D9AE" transform="rotate(-35 112 95)"/>' +
      '<ellipse cx="88" cy="118" rx="5" ry="2" fill="#E9D9AE" transform="rotate(60 88 118)"/>' +
      '<ellipse cx="65" cy="100" rx="5" ry="2" fill="#E9D9AE" transform="rotate(-5 65 100)"/>' +
      '</g>' +
      '<g fill="#2E5F55" opacity="0.85">' +
      '<circle cx="83" cy="95" r="1.6"/><circle cx="90" cy="105" r="1.6"/><circle cx="110" cy="88" r="1.6"/><circle cx="117" cy="108" r="1.6"/><circle cx="100" cy="120" r="1.6"/>' +
      '</g></svg>';
  }

  // ---------- i18n static text ----------
  function applyStaticI18n() {
    document.documentElement.lang = state.lang;
    document.documentElement.dir = state.lang === "ar" ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    document.querySelectorAll("[data-i18n-placeholder]").forEach(function (el) {
      el.setAttribute("placeholder", t(el.getAttribute("data-i18n-placeholder")));
    });
    document.getElementById("brandName").textContent = BRAND[state.lang];
    document.getElementById("brandStatus").textContent = t("open");
    document.getElementById("langSelect").value = state.lang;
  }

  // ---------- Filters row ----------
  function renderFilters() {
    var row = document.getElementById("filterRow");
    var defs = [
      { key: "veg", label: t("filterVeg") },
      { key: "spicy", label: t("filterSpicy") },
      { key: "popular", label: t("filterPopular") }
    ];
    row.innerHTML = defs.map(function (f) {
      var pressed = state.activeFilters.has(f.key);
      return '<button class="filter-chip" data-filter="' + f.key + '" aria-pressed="' + pressed + '" type="button">' + f.label + "</button>";
    }).join("");
    row.querySelectorAll("[data-filter]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var key = btn.getAttribute("data-filter");
        if (state.activeFilters.has(key)) state.activeFilters.delete(key); else state.activeFilters.add(key);
        renderFilters();
        renderMenu();
      });
    });
  }

  // ---------- Category nav ----------
  var catObserver = null;
  function renderCatNav() {
    var nav = document.getElementById("catNav");
    nav.innerHTML = CATEGORIES.map(function (c) {
      var selected = c.id === state.activeCategory;
      return '<button class="cat-chip" data-cat="' + c.id + '" aria-selected="' + selected + '" type="button">' + c[state.lang] + "</button>" ;
    }).join("") + '<span class="cat-indicator" id="catIndicator"></span>';

    nav.querySelectorAll("[data-cat]").forEach(function (chip) {
      chip.addEventListener("click", function () {
        var id = chip.getAttribute("data-cat");
        state.activeCategory = id;
        placeCatIndicator(chip, true);
        var target = document.getElementById("cat-" + id);
        if (target) target.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    });
    requestAnimationFrame(function () {
      var current = nav.querySelector('[aria-selected="true"]') || nav.querySelector("[data-cat]");
      if (current) placeCatIndicator(current, false);
    });
  }
  function placeCatIndicator(chip, animate) {
    var nav = document.getElementById("catNav");
    var indicator = document.getElementById("catIndicator");
    var navRect = nav.getBoundingClientRect();
    var chipRect = chip.getBoundingClientRect();
    indicator.style.transition = animate ? "" : "none";
    indicator.style.width = chipRect.width + "px";
    var offset = chipRect.left - navRect.left + nav.scrollLeft;
    indicator.style.transform = "translateX(" + offset + "px)";
  }
  function setActiveCategoryChip(id) {
    if (state.activeCategory === id) return;
    state.activeCategory = id;
    var nav = document.getElementById("catNav");
    nav.querySelectorAll("[data-cat]").forEach(function (c) {
      c.setAttribute("aria-selected", c.getAttribute("data-cat") === id ? "true" : "false");
    });
    var chip = nav.querySelector('[data-cat="' + id + '"]');
    if (chip) placeCatIndicator(chip, true);
  }

  // ---------- Filtering + rendering menu ----------
  function matchesQuery(item) {
    if (!state.query) return true;
    var q = state.query.toLowerCase();
    var name = item[state.lang].name.toLowerCase();
    var desc = item[state.lang].desc.toLowerCase();
    return name.indexOf(q) !== -1 || desc.indexOf(q) !== -1;
  }
  function matchesFilters(item) {
    if (state.activeFilters.size === 0) return true;
    var ok = true;
    if (state.activeFilters.has("veg")) ok = ok && item.tags.indexOf("veg") !== -1;
    if (state.activeFilters.has("spicy")) ok = ok && item.tags.indexOf("spicy") !== -1;
    if (state.activeFilters.has("popular")) ok = ok && item.recommended === true;
    return ok;
  }
  function itemsFor(categoryId) {
    return MENU.filter(function (i) { return i.category === categoryId && matchesQuery(i) && matchesFilters(i); });
  }

  var revealObserver = null;
  function ensureRevealObserver() {
    if (revealObserver) return revealObserver;
    revealObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          entry.target.classList.add("revealed");
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15, rootMargin: "0px 0px -40px 0px" });
    return revealObserver;
  }

  function itemCardHTML(item, index) {
    var d = item[state.lang];
    var badges = "";
    if (item.tags.indexOf("spicy") !== -1) badges += '<span class="badge spicy">' + t("filterSpicy") + "</span>";
    if (item.tags.indexOf("veg") !== -1) badges += '<span class="badge">' + t("filterVeg") + "</span>";
    var img = item.image ? '<div class="plate">' + plateSVG() + "</div>" : "";
    return '<article class="item-card' + (item.image ? " has-image" : "") + '" data-id="' + item.id + '" style="transition-delay:' + Math.min(index * 45, 260) + 'ms">' +
      img +
      "<h4>" + d.name + " " + badges + "</h4>" +
      '<p class="desc">' + d.desc + "</p>" +
      '<div class="item-foot">' +
      '<span class="price num">' + item.price + " " + CONFIG.currency + "</span>" +
      '<button class="add-mini" data-add="' + item.id + '" aria-label="' + t("add") + '">+</button>' +
      "</div></article>";
  }

  function renderMenu() {
    var container = document.getElementById("categorySections");
    var observer = ensureRevealObserver();
    var anyVisible = false;
    var html = "";
    CATEGORIES.forEach(function (cat) {
      var items = itemsFor(cat.id);
      if (items.length === 0) return;
      anyVisible = true;
      html += '<section class="section" id="cat-' + cat.id + '" data-cat-section="' + cat.id + '">' +
        '<div class="section-head"><h2 class="section-title display">' + cat[state.lang] + '</h2><span class="section-count num">' + items.length + "</span></div>" +
        '<div class="grid">' + items.map(function (it, idx) { return itemCardHTML(it, idx); }).join("") + "</div>" +
        "</section>";
    });
    container.innerHTML = html;
    document.getElementById("emptyState").hidden = anyVisible;

    container.querySelectorAll(".item-card").forEach(function (card) { observer.observe(card); });
    container.querySelectorAll("[data-add]").forEach(function (btn) {
      btn.addEventListener("click", function () { addToCart(btn.getAttribute("data-add"), 1); });
    });

    // scroll-spy
    if (catObserver) catObserver.disconnect();
    catObserver = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (entry.isIntersecting) {
          var id = entry.target.getAttribute("data-cat-section");
          setActiveCategoryChip(id);
        }
      });
    }, { rootMargin: "-140px 0px -70% 0px", threshold: 0 });
    container.querySelectorAll("[data-cat-section]").forEach(function (sec) { catObserver.observe(sec); });
  }

  function renderRecommended() {
    var rail = document.getElementById("recommendedRail");
    var items = MENU.filter(function (i) { return i.recommended; });
    rail.innerHTML = items.map(function (item) {
      var d = item[state.lang];
      return '<article class="rail-card" data-id="' + item.id + '">' +
        '<div class="plate">' + plateSVG() + "</div>" +
        "<h4>" + d.name + "</h4>" +
        '<p class="desc">' + d.desc + "</p>" +
        '<div class="foot"><span class="price num">' + item.price + " " + CONFIG.currency + '</span><button class="add-mini" data-add="' + item.id + '" aria-label="' + t("add") + '">+</button></div>' +
        "</article>";
    }).join("");
    rail.querySelectorAll("[data-add]").forEach(function (btn) {
      btn.addEventListener("click", function () { addToCart(btn.getAttribute("data-add"), 1); });
    });
  }

  // ---------- Cart ----------
  function cartCount() {
    return Object.keys(state.cart).reduce(function (sum, id) { return sum + state.cart[id]; }, 0);
  }
  function cartTotal() {
    return Object.keys(state.cart).reduce(function (sum, id) {
      var item = MENU.filter(function (m) { return m.id === id; })[0];
      return item ? sum + item.price * state.cart[id] : sum;
    }, 0);
  }
  function addToCart(id, qty) {
    state.cart[id] = (state.cart[id] || 0) + qty;
    persistCart();
    updateCartBadge(true);
    renderCartLines();
    showToast(t("addedToast"));
  }
  function updateCartBadge(bump) {
    var badge = document.getElementById("cartBadge");
    badge.textContent = cartCount();
    if (bump) {
      badge.classList.remove("bump");
      void badge.offsetWidth;
      badge.classList.add("bump");
      setTimeout(function () { badge.classList.remove("bump"); }, 200);
    }
  }
  var toastTimer = null;
  function showToast(msg) {
    var toast = document.getElementById("toast");
    toast.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1700);
  }
  function renderCartLines() {
    var wrap = document.getElementById("cartLines");
    var ids = Object.keys(state.cart).filter(function (id) { return state.cart[id] > 0; });
    if (ids.length === 0) {
      wrap.innerHTML = '<p class="cart-empty">' + t("empty") + "</p>";
    } else {
      wrap.innerHTML = ids.map(function (id) {
        var item = MENU.filter(function (m) { return m.id === id; })[0];
        if (!item) return "";
        var d = item[state.lang];
        var qty = state.cart[id];
        return '<div class="cart-line" data-line="' + id + '">' +
          '<div class="cart-line-info"><h5>' + d.name + '</h5><span class="num">' + item.price + " " + CONFIG.currency + "</span></div>" +
          '<div class="stepper">' +
          '<button data-dec="' + id + '" type="button" aria-label="-">−</button>' +
          '<span class="qty num">' + qty + "</span>" +
          '<button data-inc="' + id + '" type="button" aria-label="+">+</button>' +
          "</div>" +
          "</div>";
      }).join("");
      wrap.querySelectorAll("[data-inc]").forEach(function (b) {
        b.addEventListener("click", function () {
          var id = b.getAttribute("data-inc");
          state.cart[id] = (state.cart[id] || 0) + 1;
          persistCart(); renderCartLines(); updateCartBadge(false);
        });
      });
      wrap.querySelectorAll("[data-dec]").forEach(function (b) {
        b.addEventListener("click", function () {
          var id = b.getAttribute("data-dec");
          state.cart[id] = Math.max(0, (state.cart[id] || 0) - 1);
          if (state.cart[id] === 0) delete state.cart[id];
          persistCart(); renderCartLines(); updateCartBadge(false);
        });
      });
    }
    document.getElementById("cartTotal").textContent = cartTotal() + " " + CONFIG.currency;
  }

  function openDrawer() {
    document.getElementById("drawer").classList.add("open");
    document.getElementById("scrim").classList.add("open");
    renderCartLines();
  }
  function closeDrawer() {
    document.getElementById("drawer").classList.remove("open");
    document.getElementById("scrim").classList.remove("open");
  }

  function genOrderRef() {
    var chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
    var s = "";
    for (var i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return "A" + s;
  }

  function sendOrder() {
    var tableInput = document.getElementById("tableInput");
    var table = tableInput.value.trim();
    if (!table) {
      tableInput.classList.add("err");
      document.getElementById("tableErr").classList.add("show");
      tableInput.focus();
      return;
    }
    tableInput.classList.remove("err");
    document.getElementById("tableErr").classList.remove("show");

    var ids = Object.keys(state.cart).filter(function (id) { return state.cart[id] > 0; });
    if (ids.length === 0) return;

    var ref = genOrderRef();
    var total = cartTotal();
    var lines = ids.map(function (id) {
      var item = MENU.filter(function (m) { return m.id === id; })[0];
      var qty = state.cart[id];
      // Order lines use the French name regardless of browsing language,
      // since kitchen/floor staff operate in French/Arabic, not the customer's chosen UI language.
      return qty + "x " + item.fr.name + " - " + item.price * qty + " " + CONFIG.currency;
    });

    var message =
      BRAND.fr + "\n" +
      "Commande " + ref + "\n" +
      "Table " + table + "\n\n" +
      lines.join("\n") + "\n\n" +
      "Total: " + total + " " + CONFIG.currency;

    try {
      localStorage.setItem("safran_last_order", JSON.stringify({
        ref: ref, table: table, items: state.cart, total: total, ts: Date.now()
      }));
      localStorage.setItem("safran_table", table);
    } catch (e) {}

    var url = "https://wa.me/" + CONFIG.whatsappNumber + "?text=" + encodeURIComponent(message);
    window.open(url, "_blank");
  }

  // ---------- Full re-render on language change ----------
  function fullRender() {
    applyStaticI18n();
    renderFilters();
    renderCatNav();
    renderRecommended();
    renderMenu();
    renderCartLines();
    updateCartBadge(false);
  }

  // ---------- Wire up static controls ----------
  function bindOnce() {
    document.getElementById("themeToggle").addEventListener("click", function () {
      var current = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
      var next = current === "dark" ? "light" : "dark";
      applyTheme(next);
      try { localStorage.setItem("safran_theme", next); } catch (e) {}
    });

    document.getElementById("langSelect").addEventListener("change", function (e) {
      state.lang = e.target.value;
      try { localStorage.setItem("safran_lang", state.lang); } catch (e2) {}
      fullRender();
    });

    document.getElementById("searchInput").addEventListener("input", function (e) {
      state.query = e.target.value;
      renderMenu();
    });

    document.getElementById("cartFab").addEventListener("click", openDrawer);
    document.getElementById("drawerClose").addEventListener("click", closeDrawer);
    document.getElementById("scrim").addEventListener("click", closeDrawer);
    document.getElementById("sendBtn").addEventListener("click", sendOrder);

    var tableInput = document.getElementById("tableInput");
    if (state.tableNumber) tableInput.value = state.tableNumber;
    tableInput.addEventListener("input", function () {
      document.getElementById("tableErr").classList.remove("show");
      tableInput.classList.remove("err");
    });

    window.addEventListener("resize", function () {
      var nav = document.getElementById("catNav");
      var current = nav.querySelector('[aria-selected="true"]');
      if (current) placeCatIndicator(current, false);
    });
  }

  // ---------- Init ----------
  loadPersisted();
  bindOnce();
  fullRender();
})();

</script>
</body>
</html>
